[workspace]
members = [
    "crates/pi-agent-core",
    "crates/pi-desktop",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["zhd"]
license = "AGPL-3.0-only"

[workspace.dependencies]
tokio = { version = "1.54.1", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
anyhow = "1.0.104"
thiserror = "2.0.21"
async-trait = "0.1.92"
futures = "0.3.34"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls", "form"] }
walkdir = "2.5.0"
regex = "1.13.1"
