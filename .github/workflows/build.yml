name: Build Pi Rust Native

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: build-pi-rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test & Lint (macOS)
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]] || exit 1
          version="$(awk '
            $0 == "[workspace.package]" { in_section = 1; next }
            in_section && /^\[/ { exit }
            in_section && /^version = / { gsub(/"/, "", $3); print $3; exit }
          ' Cargo.toml)"
          [[ "$RELEASE_TAG" == "v$version" ]] || { echo "Release tag does not match package version"; exit 1; }

      - name: Run Cargo Check
        run: cargo check --locked --workspace --all-targets

      - name: Run Rustfmt Check
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Run Cargo Test
        run: cargo test --locked --workspace --all-targets

  build-macos:
    name: Build macOS Binary (arm64)
    needs: test
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Import macOS release signing certificate
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${MACOS_CERTIFICATE_P12_BASE64:-}" || -z "${MACOS_CERTIFICATE_PASSWORD:-}" ]]; then
            echo "Apple signing certificate is not configured; building an unsigned release."
            exit 0
          fi
          keychain="$RUNNER_TEMP/volt-signing.keychain-db"
          certificate="$RUNNER_TEMP/volt-signing.p12"
          keychain_password="$(uuidgen)"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 -D > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -s "$keychain"

      - name: Build Desktop Release
        run: cargo build --locked --release --workspace --bins --target aarch64-apple-darwin

      - name: Package macOS binaries
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 != '' && secrets.MACOS_CERTIFICATE_PASSWORD != '' && secrets.MACOS_SIGNING_IDENTITY || '' }}
          MACOS_REQUIRE_SIGNING: "0"
          MACOS_REQUIRE_NOTARIZATION: "0"
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          version="$(awk '
            $0 == "[workspace.package]" { in_section = 1; next }
            in_section && /^\[/ { exit }
            in_section && /^version = / { gsub(/"/, "", $3); print $3; exit }
          ' Cargo.toml)"
          bash scripts/package-macos.sh "$PWD/target/aarch64-apple-darwin/release" "$PWD/dist" "$version"

      - name: Upload macOS Binary
        uses: actions/upload-artifact@v4
        with:
          name: volt-macos-arm64
          path: dist/volt-macos-arm64.tar.gz
          if-no-files-found: error
          retention-days: 14

  build-windows:
    name: Build Windows Binary (x64)
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Desktop Release
        run: cargo build --locked --release --workspace --bins

      - name: Validate Windows package entrypoint
        shell: pwsh
        run: |
          cargo test --locked --workspace --all-targets
          if ($LASTEXITCODE -ne 0) { throw "Windows tests failed" }
          ./scripts/test-install.ps1 -ExePath ./target/release/volt.exe

      - name: Prepare Windows Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/windows -Force | Out-Null
          Copy-Item target/release/volt.exe dist/windows/
          Copy-Item target/release/office-cli.exe dist/windows/
          Copy-Item target/release/calc-cli.exe dist/windows/
          Copy-Item scripts/install.ps1 dist/windows/
          Copy-Item README.md dist/windows/
          Compress-Archive -Path dist/windows/* -DestinationPath dist/volt-windows-x64.zip -Force

      - name: Upload Windows Executable
        uses: actions/upload-artifact@v4
        with:
          name: volt-windows-x64-exe
          path: target/release/volt.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows Zip Package
        uses: actions/upload-artifact@v4
        with:
          name: volt-windows-x64-bundle
          path: dist/volt-windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release Assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: volt-macos-arm64
          path: dist

      - name: Download Windows executable artifact
        uses: actions/download-artifact@v4
        with:
          name: volt-windows-x64-exe
          path: dist

      - name: Download Windows bundle
        uses: actions/download-artifact@v4
        with:
          name: volt-windows-x64-bundle
          path: dist

      - name: Prepare release assets
        shell: bash
        run: |
          mv dist/volt.exe dist/volt-windows-x64.exe
          cd dist
          sha256sum volt-windows-x64.exe > volt-windows-x64.exe.sha256
          sha256sum volt-macos-arm64.tar.gz volt-windows-x64.zip volt-windows-x64.exe > SHA256SUMS

      - name: Set up Bun for CTFile publishing
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Publish release assets to CTFile
        env:
          CTFILE_SESSION: ${{ secrets.CTFILE_SESSION }}
          CTFILE_FOLDER_ID: ${{ secrets.CTFILE_FOLDER_ID }}
          CTFILE_PUBLIC_ROOT_URL: ${{ vars.CTFILE_PUBLIC_ROOT_URL }}
          CTFILE_RETRIES: "3"
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/publish-ctfile.ts \
            --version "$GITHUB_REF_NAME" \
            --output dist/ctfile-links.md \
            --file dist/volt-macos-arm64.tar.gz \
            --file dist/volt-windows-x64.zip \
            --file dist/volt-windows-x64.exe \
            --file dist/SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          generate_release_notes: true
          body_path: dist/ctfile-links.md
          files: |
            dist/volt-macos-arm64.tar.gz
            dist/volt-windows-x64.zip
            dist/SHA256SUMS
            dist/volt-windows-x64.exe
            dist/volt-windows-x64.exe.sha256
            dist/ctfile-links.md

      - name: Publish CTFile links to job summary
        shell: bash
        run: |
          set -euo pipefail
          cat dist/ctfile-links.md >> "$GITHUB_STEP_SUMMARY"
